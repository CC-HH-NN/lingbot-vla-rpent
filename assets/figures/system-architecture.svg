<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">LingBot-VLA post-training, inference and RPent Agent architecture</title>
  <desc id="desc">A pipeline from demonstrations and the LingBot-VLA base model through post-training and checkpoint selection, into VLA inference and action scheduling, with an optional official RPent Agent planning layer, RoboTwin execution, and evidence aggregation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #172033; }
      .section { font: 700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #475569; letter-spacing: .08em; }
      .label { font: 700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #172033; }
      .sub { font: 400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #475569; }
      .edge { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .upstream { fill: #E8F1FA; stroke: #2B6CB0; stroke-width: 2; }
      .project { fill: #E8F5EE; stroke: #2F855A; stroke-width: 2; }
      .system { fill: #FFF4DF; stroke: #C77C02; stroke-width: 2; }
      .evidence { fill: #F2ECFA; stroke: #805AD5; stroke-width: 2; }
      .legend { font: 400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="600" y="48" text-anchor="middle" class="title">LingBot-VLA: from post-training to embodied Agent evaluation</text>

  <text x="70" y="95" class="section">INPUTS</text>
  <rect x="70" y="115" width="260" height="96" rx="14" class="upstream"/>
  <text x="200" y="153" text-anchor="middle" class="label">RoboTwin demonstrations</text>
  <text x="200" y="180" text-anchor="middle" class="sub">clean data · task diversity</text>
  <rect x="370" y="115" width="260" height="96" rx="14" class="upstream"/>
  <text x="500" y="153" text-anchor="middle" class="label">LingBot-VLA 2.0</text>
  <text x="500" y="180" text-anchor="middle" class="sub">base VLA · RGB + qpos14</text>

  <text x="70" y="260" class="section">MODEL DEVELOPMENT</text>
  <rect x="70" y="280" width="260" height="110" rx="14" class="project"/>
  <text x="200" y="319" text-anchor="middle" class="label">Post-training recipes</text>
  <text x="200" y="346" text-anchor="middle" class="sub">SFT · augmentation · EMA</text>
  <text x="200" y="368" text-anchor="middle" class="sub">B/C consistency routes</text>
  <rect x="370" y="280" width="260" height="110" rx="14" class="project"/>
  <text x="500" y="319" text-anchor="middle" class="label">Checkpoint selection</text>
  <text x="500" y="346" text-anchor="middle" class="sub">250-episode protocol</text>
  <text x="500" y="368" text-anchor="middle" class="sub">clean / randomized</text>
  <rect x="710" y="280" width="220" height="110" rx="14" class="system"/>
  <text x="820" y="319" text-anchor="middle" class="label">VLA inference</text>
  <text x="820" y="346" text-anchor="middle" class="sub">BF16 · action chunks</text>
  <text x="820" y="368" text-anchor="middle" class="sub">fixed window / service</text>
  <rect x="970" y="280" width="160" height="110" rx="14" class="system"/>
  <text x="1050" y="319" text-anchor="middle" class="label">Scheduling</text>
  <text x="1050" y="346" text-anchor="middle" class="sub">Fixed20/50</text>
  <text x="1050" y="368" text-anchor="middle" class="sub">AutoHorizon · RTC</text>

  <text x="70" y="440" class="section">CLOSED LOOP</text>
  <rect x="70" y="460" width="250" height="110" rx="14" class="project"/>
  <text x="195" y="499" text-anchor="middle" class="label">Official RPent Agent</text>
  <text x="195" y="526" text-anchor="middle" class="sub">planner · tools · official memory</text>
  <text x="195" y="548" text-anchor="middle" class="sub">qpos14 interface adaptation</text>
  <rect x="390" y="460" width="250" height="110" rx="14" class="system"/>
  <text x="515" y="499" text-anchor="middle" class="label">RoboTwin execution</text>
  <text x="515" y="526" text-anchor="middle" class="sub">observe → act → feedback</text>
  <text x="515" y="548" text-anchor="middle" class="sub">native eval_success</text>
  <rect x="710" y="460" width="220" height="110" rx="14" class="evidence"/>
  <text x="820" y="499" text-anchor="middle" class="label">Evidence ledger</text>
  <text x="820" y="526" text-anchor="middle" class="sub">seed · failure type · timing</text>
  <text x="820" y="548" text-anchor="middle" class="sub">per-task results</text>
  <rect x="970" y="460" width="160" height="110" rx="14" class="evidence"/>
  <text x="1050" y="499" text-anchor="middle" class="label">Figures</text>
  <text x="1050" y="526" text-anchor="middle" class="sub">loss · rates</text>
  <text x="1050" y="548" text-anchor="middle" class="sub">heatmap · trade-offs</text>

  <path d="M200 211 V280" class="edge"/>
  <path d="M500 211 V280" class="edge"/>
  <path d="M330 335 H370" class="edge"/>
  <path d="M630 335 H710" class="edge"/>
  <path d="M930 335 H970" class="edge"/>
  <path d="M820 390 V430 H515 V460" class="edge"/>
  <path d="M195 390 V430 H515 V460" class="edge"/>
  <path d="M640 515 H710" class="edge"/>
  <path d="M930 515 H970" class="edge"/>
  <path d="M820 460 V410 H500 V390" class="edge"/>

  <rect x="70" y="625" width="16" height="16" rx="3" class="upstream"/><text x="96" y="638" class="legend">upstream component</text>
  <rect x="270" y="625" width="16" height="16" rx="3" class="project"/><text x="296" y="638" class="legend">project contribution</text>
  <rect x="478" y="625" width="16" height="16" rx="3" class="system"/><text x="504" y="638" class="legend">runtime system</text>
  <rect x="666" y="625" width="16" height="16" rx="3" class="evidence"/><text x="692" y="638" class="legend">evidence / reporting</text>
</svg>
